name: social_flutter
description: Ntripi — social media app frontend (Flutter)
publish_to: 'none'

version: 0.3.0

environment:
  # google_sign_in 7.x requires Dart >= 3.7 (the v7 rewrite). Local toolchain is 3.12.
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  expandable_page_view: ^1.0.17
  # State management: Riverpod — compile-safe, testable, no BuildContext required
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # HTTP client with interceptor support — used for the auth token injection
  dio: ^5.4.3

  # Cache GET responses so the app stays browsable while offline.
  # Serves stale data on Dio connection errors; never caches mutations.
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^4.0.0

  # Resolve a writable directory for the Hive cache store.
  path_provider: ^2.1.4

  # Cache network images on disk so cover photos / avatars survive offline.
  # Dio's cache interceptor only handles JSON; image bytes need their own
  # cache layer.
  cached_network_image: ^3.4.1

  # Underlying disk cache used by cached_network_image — imported directly so
  # we can declare a project-wide CacheManager with our own TTL/key namespace
  # in lib/core/cache/image_cache.dart.
  flutter_cache_manager: ^3.4.1

  # Check network status (online/offline) and type (WiFi/mobile)
  connectivity_plus: ^7.1.1

  # Secure token storage — uses iOS Keychain / Android Keystore under the hood
  flutter_secure_storage: ^10.3.1

  # Declarative navigation with type-safe routes
  go_router: ^17.3.0

  # Map rendering using OpenStreetMap tiles — no API key required.
  # ODbL license: coordinates from Nominatim are legal to store and display.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Native OS share sheet — share a URL + caption to any installed app.
  share_plus: ^13.2.0

  # DM Sans font (used by NTripi design system)
  google_fonts: ^8.1.0

  # Photo/file picker — used for itinerary cover image uploads.
  image_picker: ^1.0.7

  # Open URLs in browser — used for store download links in the web banner.
  url_launcher: ^6.3.0
  photo_view: ^0.15.0

  # Render user-authored Markdown notes (bold, italic, headings, lists).
  # Configured link-inert: no clickable URLs in user content (phishing surface).
  # flutter_markdown_plus is the maintained successor to the discontinued flutter_markdown.
  flutter_markdown_plus: ^1.0.3
  # Direct dep so we can reference `md.ExtensionSet` to lock down the parser.
  markdown: ^7.3.0
  email_validator: ^3.0.0

  # "Sign in with Google". v7 API: GoogleSignIn.instance.initialize() +
  # authenticate() (mobile/iOS) / renderButton (web). We send the resulting
  # ID token to the backend, which verifies it and issues our own tokens.
  google_sign_in: ^7.2.0
  # Declared explicitly because the web build imports its `web_only.dart`
  # (renderButton). It is otherwise a transitive dep of google_sign_in.
  google_sign_in_web: ^1.1.3
  font_awesome_flutter: ^11.0.0
  geolocator: ^14.0.3

  # Renders a Google Maps Embed API iframe (/maps/embed/v1/place) inside the
  # stop link-preview card — mobile only. The Embed API key rides in the URL,
  # so no native manifest/plist config (unlike the google_maps_flutter SDK).
  webview_flutter: ^4.13.0
  web: ^1.1.1

  # On-device NSFW pre-check (mobile) — runs a bundled TFLite model as the
  # client tier of image moderation. Web uses NSFWJS via JS interop instead
  # (lib/core/moderation/). Never-block: a missing model disables the check.
  tflite_flutter: ^0.12.1
  # Shake-to-report-a-bug (lib/features/bug_report/). `shake` is the
  # accelerometer gesture (pulls sensors_plus); `feedback` supplies the
  # screenshot capture + draw-over layer only — the compose sheet is ours, via
  # its feedbackBuilder, so it renders in the Ntripi theme. The two *_info_plus
  # packages fill in the diagnostics an operator needs to reproduce a report.
  shake: ^3.0.0
  feedback: ^3.2.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

  # One-shot UI sound cues (lib/core/services/sfx_service.dart). Chosen over
  # soundpool (discontinued) and just_audio (built for streaming) — this is the
  # only player with first-class web support, which the toggle also ships to.
  audioplayers: ^6.8.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation for Riverpod providers (@riverpod annotation)
  riverpod_generator: ^4.0.4
  build_runner: ^2.4.9
  # Intercepts Dio HTTP calls in unit tests — no real network needed.
  http_mock_adapter: ^0.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
   - assets/data/currencies.json
   # NSFW pre-check model (mobile). The .tflite binary is not committed — the
   # check is a no-op until it's dropped in (see assets/models/README.md).
   - assets/models/nsfw_mobilenet.tflite
   # UI sound cues. AssetSource paths drop the `assets/` prefix — AudioCache
   # adds it back (see sfx_service.dart).
   - assets/SFX/Open_itinerary.wav
   - assets/SFX/fold-a-map.wav
   - assets/SFX/Delete_itinerary.wav
   - assets/SFX/New_notification.wav
