# Alembic configuration file.
# This is the entry point for the `alembic` CLI tool.
#
# NOTE: The DATABASE_URL is intentionally NOT set here.
# It is loaded from settings (from .env) in alembic/env.py.
# This ensures the DB URL is defined in exactly one place.

[alembic]
# Path to the migration scripts directory.
script_location = alembic

# Template used to generate migration filenames.
# %%(rev)s = short revision hash, %%(slug)s = description derived from message.
file_template = %%(rev)s_%%(slug)s

# Timezone for generated revision timestamps.
timezone = UTC

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
