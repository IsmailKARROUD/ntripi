<script>
// Instant narrowing for the search box. Deliberately NOT a second ranking
// implementation: help_service.search() in Python is authoritative and is what
// the Enter key reaches. This only substring-narrows an already-folded index so
// the dropdown can answer between keystrokes without a request per character.
(function () {
  var input = document.getElementById('hc-q');
  var box = document.getElementById('hc-suggest');
  if (!input || !box) return;

  var docs = null, loading = false;

  // The same steps as help_service.fold(), in the same order, so both sides
  // agree what a word is: lowercase, drop combining marks, punctuation to
  // spaces, then normalise Arabic orthography and strip its definite article.
  // The Arabic half is not optional — without it a query for "المسار" cannot
  // match a title carrying "مسار", because containment runs the wrong way.
  // JavaScript's \w is ASCII-only — unlike Python's, which is Unicode-aware for
  // str patterns. So the obvious /[^\w\s]/ erases every Arabic letter and every
  // Chinese character rather than just the punctuation, and the two folders stop
  // agreeing the moment the index is not English. \p{L}\p{N} with the u flag is
  // the equivalent; the fallback keeps an ancient browser searching in English
  // instead of throwing at parse time.
  var PUNCT;
  try { PUNCT = new RegExp('[^\\p{L}\\p{N}\\s_]', 'gu'); }
  catch (e) { PUNCT = /[^\w\s]/g; }

  function fold(s) {
    var t = s.toLowerCase().normalize('NFD')
             .replace(/[\u0300-\u036f]/g, '')   // combining marks
             .replace(PUNCT, ' ')
             .replace(/[\u0623\u0625\u0622\u0671]/g, '\u0627')  // alef variants
             .replace(/\u0629/g, '\u0647')       // taa marbuta
             .replace(/\u0649/g, '\u064a')       // alef maksura
             .replace(/\u0640/g, '')             // tatweel
             .replace(/\s+/g, ' ').trim();
    if (!t) return t;
    return t.split(' ').map(function (w) {
      return w.replace(/^\u0627\u0644(?=[\u0621-\u064a]{3,})/, '');
    }).join(' ');
  }

  // CJK writes without spaces, so a Chinese question folds to one long token
  // that appears verbatim nowhere and the dropdown would stay empty for every
  // natural phrasing. Same majority-of-bigrams rule as help_service._score_token,
  // so the dropdown and the Enter key agree about what counts as a match.
  var CJK = /[\u3400-\u9fff\uf900-\ufaff\u3040-\u30ff\uac00-\ud7af]/;

  function present(hay, token) {
    if (hay.indexOf(token) !== -1) return true;
    if (token.length < 3 || !CJK.test(token)) return false;
    var grams = token.length - 1, hit = 0;
    for (var i = 0; i < grams; i++) {
      if (hay.indexOf(token.substr(i, 2)) !== -1) hit++;
    }
    return hit * 2 >= grams;
  }

  // Fetched on first interaction rather than on page load: most visitors read
  // an article and never search, and the index is dead weight for them.
  function load() {
    if (docs || loading) return;
    loading = true;
    fetch('/help/search-index.json?lang=' + encodeURIComponent(document.documentElement.lang || 'en'))
      .then(function (r) { return r.json(); })
      .then(function (d) { docs = d.docs || []; render(); })
      .catch(function () { loading = false; });  // Enter still reaches the server
  }

  function render() {
    var tokens = fold(input.value).split(' ').filter(function (t) { return t.length >= 2; }).slice(0, 6);
    if (!docs || !tokens.length) { box.hidden = true; box.textContent = ''; return; }

    var hits = docs.filter(function (d) {
      var hay = d.t + ' ' + d.k + ' ' + d.d + ' ' + d.c + ' ' + d.b;
      return tokens.every(function (t) { return present(hay, t); });
    }).slice(0, 6);

    box.textContent = '';
    if (!hits.length) { box.hidden = true; return; }
    box.className = 'hc-suggest';
    hits.forEach(function (d) {
      // createElement + textContent, never innerHTML: the index is ours, but a
      // dropdown that renders markup is a sink waiting for content that is not.
      var a = document.createElement('a');
      a.href = '/help/' + d.s;
      a.appendChild(document.createTextNode(d.n));
      var sub = document.createElement('span');
      sub.className = 's-sub';
      sub.textContent = d.x;
      a.appendChild(sub);
      box.appendChild(a);
    });
    box.hidden = false;
  }

  input.addEventListener('focus', load);
  input.addEventListener('input', function () { load(); render(); });
  document.addEventListener('click', function (e) {
    if (!box.contains(e.target) && e.target !== input) box.hidden = true;
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Escape') box.hidden = true; });
})();
</script>
