{% extends "_base.html" %}
{% block content %}

<style>
  .auth-form {
    max-width: 400px;
    margin: 0 auto;
    padding-top: 24px;
  }

  .auth-form h2 {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 28px;
    text-align: center;
  }

  .auth-form label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 16px;
  }

  .auth-form input[type="email"],
  .auth-form input[type="password"],
  .auth-form input[type="text"] {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--white);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .auth-form input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }

  .auth-form .btn-primary {
    width: 100%;
    text-align: center;
    margin-top: 8px;
  }

  .auth-switch {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--sub);
  }
</style>

<section class="auth-form">
  <h2>Sign in to Ntripi</h2>

  {% if error_message %}
  <div class="error-banner">{{ error_message }}</div>
  {% endif %}

  <form method="POST" action="/web/login">
    <label>
      Email or username
      <input type="text" name="identifier" required autofocus
             value="{{ identifier or '' }}" autocomplete="username">
    </label>

    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <button type="submit" class="btn-primary btn-large">Sign in</button>
  </form>

  <p class="auth-switch">
    New to Ntripi? <a href="/register">Create an account</a>
  </p>
</section>

{% endblock %}
