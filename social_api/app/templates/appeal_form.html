{% extends "_base.html" %}
{% block content %}

<section class="card" style="max-width:520px;margin:0 auto">
  <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;text-align:center">Appeal a decision</h2>
  <p style="text-align:center;color:var(--text2);margin-bottom:20px">
    Tell us why you believe the {{ action_label }} was incorrect. A moderator will
    review your explanation and email you the outcome.
  </p>

  {% if error_message %}
  <div class="error-banner">{{ error_message }}</div>
  {% endif %}

  <form method="POST" action="/web/appeal">
    <input type="hidden" name="token" value="{{ token or '' }}">

    <div class="form-group">
      <label class="form-label" for="reason">Your explanation</label>
      <textarea class="form-input" id="reason" name="reason" rows="6" required autofocus
                maxlength="2000" placeholder="Explain what you believe was wrong…"></textarea>
    </div>

    <button type="submit" class="btn-primary" style="width:100%;text-align:center;margin-top:8px">
      Submit appeal
    </button>
  </form>
</section>

{% endblock %}
