<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or "Ntripi" }}</title>
  <meta name="description" content="{{ page_description or 'Travel itineraries, shared.' }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title or 'Ntripi' }}">
  <meta property="og:description" content="{{ page_description or 'Travel itineraries, shared.' }}">
  <meta property="og:url" content="https://ntripi.app{{ request.url.path }}">
  <meta property="og:image" content="https://ntripi.app/static/ntripi-og-default.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title or 'Ntripi' }}">
  <meta name="twitter:description" content="{{ page_description or 'Travel itineraries, shared.' }}">
  <meta name="twitter:image" content="https://ntripi.app/static/ntripi-og-default.jpg">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:        #4F46E5;
      --brand-hover:  #4338CA;
      --brand-light:  #EEF2FF;
      --text:         #111827;
      --sub:          #6B7280;
      --border:       #E5E7EB;
      --bg:           #F9FAFB;
      --white:        #FFFFFF;
      --radius:       12px;
      --error-bg:     #FEF2F2;
      --error-border: #FECACA;
      --error-text:   #B91C1C;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .logo:hover { text-decoration: none; }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a {
      font-size: 14px;
      font-weight: 500;
      color: var(--sub);
    }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--brand);
      color: var(--white) !important;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      display: inline-block;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--brand-hover); text-decoration: none; }

    .btn-secondary {
      background: var(--white);
      color: var(--brand) !important;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      border: 2px solid var(--brand);
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      display: inline-block;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: var(--brand-light); text-decoration: none; }

    .btn-large {
      padding: 14px 28px;
      font-size: 16px;
      border-radius: var(--radius);
    }

    /* ── Main content area ── */
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--sub);
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    footer a { color: var(--sub); }
    footer a:hover { color: var(--text); text-decoration: none; }

    @media (min-width: 768px) {
      main { padding: 48px 24px 80px; }
    }

    @media (min-width: 1024px) {
      main { max-width: 960px; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">Ntripi</a>
  <nav>
    <a href="/login">Sign in</a>
    <a href="/register" class="btn-primary">Sign up</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <a href="/privacy">Privacy</a>
  <a href="/terms">Terms</a>
  <span>© Ntripi {{ current_year }}</span>
</footer>

</body>
</html>
