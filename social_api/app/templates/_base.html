<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" dir="{{ dir or 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or "NTripi" }}</title>
  <meta name="description" content="{{ page_description or _('meta_default_desc') }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title or 'NTripi' }}">
  <meta property="og:description" content="{{ page_description or _('meta_default_desc') }}">
  <meta property="og:url" content="https://ntripi.app{{ request.url.path }}">
  <meta property="og:image" content="https://ntripi.app/static/ntripi-og-default.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title or 'NTripi' }}">
  <meta name="twitter:description" content="{{ page_description or 'Travel itineraries, shared.' }}">
  <meta name="twitter:image" content="https://ntripi.app/static/ntripi-og-default.png">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F5E3A'/><polyline points='8,24 8,10 16,20 24,10' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='24' cy='10' r='3' fill='%23C89030'/><circle cx='24' cy='10' r='1.5' fill='white'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest:       oklch(34% 0.11 150);
      --canopy:       oklch(48% 0.13 150);
      --mist:         oklch(90% 0.06 150);
      --amber:        oklch(66% 0.17 75);
      --sand:         oklch(97% 0.008 80);
      --bark:         oklch(18% 0.03 150);
      --text:         oklch(18% 0.03 150);
      --text2:        oklch(48% 0.04 150);
      --border:       oklch(90% 0.02 150);
      --surface:      #ffffff;
      --radius:       14px;
      --error-bg:     #FFEDAD;
      --error-border: #FFB4AB;
      --error-text:   #410002;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--sand);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--forest); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ── */
    header {
      background: rgba(245,242,236,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .logo-text {
      font-size: 18px;
      font-weight: 800;
      color: var(--forest);
      letter-spacing: -0.5px;
    }
    .logo:hover { text-decoration: none; }

    nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
    }
    nav a:hover { color: var(--text); text-decoration: none; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--forest);
      color: #fff !important;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 50px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      display: inline-block;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(20,80,40,.2);
    }
    .btn-primary:hover { background: var(--canopy); transform: translateY(-1px); text-decoration: none; }

    .btn-secondary {
      background: var(--surface);
      color: var(--forest) !important;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 50px;
      border: 2px solid var(--forest);
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      display: inline-block;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: var(--mist); text-decoration: none; }

    /* ── Main content area ── */
    main {
      flex: 1;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }

    /* ── Form elements ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--forest); }
    .form-input::placeholder { color: oklch(72% 0.03 150); }

    /* ── Error banner ── */
    .error-banner {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 28px 24px;
      box-shadow: 0 1px 3px rgba(0,40,20,.06), 0 4px 12px rgba(0,40,20,.05);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text2);
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    footer a { color: var(--text2); }
    footer a:hover { color: var(--forest); text-decoration: none; }

    @media (min-width: 768px) {
      main { padding: 56px 24px 80px; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="oklch(34% 0.11 150)"/>
      <polyline points="8,24 8,10 16,20 24,10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="24" cy="10" r="3" fill="oklch(66% 0.17 75)"/>
      <circle cx="24" cy="10" r="1.5" fill="white"/>
    </svg>
    <span class="logo-text">NTripi</span>
  </a>
  <nav>
    {% for code in supported if code != lang %}<a href="?lang={{ code }}">{{ lang_names[code] }}</a>{% endfor %}
    <a href="/login">{{ _('nav_sign_in') }}</a>
    <a href="/register" class="btn-primary">{{ _('nav_sign_up') }}</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <a href="/privacy">{{ _('footer_privacy') }}</a>
  <a href="/terms">{{ _('footer_terms') }}</a>
  <span>© NTripi {{ current_year }}</span>
</footer>

</body>
</html>
