{% extends "_base.html" %}
{% block content %}

<style>
  .auth-form {
    max-width: 400px;
    margin: 0 auto;
    padding-top: 24px;
  }

  .auth-form h2 {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 28px;
    text-align: center;
  }

  .auth-form label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 16px;
  }

  .auth-form input[type="email"],
  .auth-form input[type="password"],
  .auth-form input[type="text"] {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--white);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .auth-form input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }

  .auth-form label.checkbox {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-weight: 400;
    color: var(--sub);
    cursor: pointer;
    margin-top: 4px;
  }

  .auth-form label.checkbox input[type="checkbox"] {
    margin-top: 3px;
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    accent-color: var(--brand);
  }

  .auth-form .btn-primary {
    width: 100%;
    text-align: center;
    margin-top: 8px;
  }

  .auth-switch {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--sub);
  }

  .field-hint {
    font-size: 12px;
    color: var(--sub);
    margin-top: 4px;
    font-weight: 400;
  }
</style>

<section class="auth-form">
  <h2>{{ _('register_heading') }}</h2>

  {% if error_message %}
  <div class="error-banner">{{ error_message }}</div>
  {% endif %}

  <form method="POST" action="/web/register">
    <label>
      {{ _('register_email') }}
      <input type="email" name="email" required autofocus
             value="{{ email or '' }}" autocomplete="email">
    </label>

    <label>
      {{ _('register_username') }}
      <input type="text" name="username" required minlength="4" maxlength="30"
             value="{{ username or '' }}" autocomplete="username"
             pattern="[a-zA-Z][a-zA-Z0-9_.]{2,28}[a-zA-Z0-9]"
             title="{{ _('register_username_help') }}">
      <span class="field-hint">{{ _('register_username_help') }}</span>
    </label>

    <label>
      {{ _('register_display_name') }} <span style="font-weight:400;color:var(--sub)">{{ _('register_optional') }}</span>
      <input type="text" name="display_name" maxlength="50"
             value="{{ display_name or '' }}">
      <span class="field-hint">{{ _('register_display_name_help') }}</span>
    </label>

    <label>
      {{ _('register_password') }}
      <input type="password" name="password" required minlength="8"
             autocomplete="new-password">
      <span class="field-hint">{{ _('register_password_help') }}</span>
    </label>

    <label>
      {{ _('register_confirm_password') }}
      <input type="password" name="password_confirm" required
             autocomplete="new-password">
    </label>

    <label class="checkbox">
      <input type="checkbox" name="tos_accepted" required>
      {{ _('register_agree_pre') }} <a href="/terms" target="_blank">{{ _('register_tos') }}</a> {{ _('register_agree_and') }}
      <a href="/privacy" target="_blank">{{ _('register_privacy') }}</a>
    </label>

    <button type="submit" class="btn-primary btn-large">{{ _('register_submit') }}</button>
  </form>

  <p class="auth-switch">
    {{ _('register_have_account') }} <a href="/login">{{ _('login_submit') }}</a>
  </p>
</section>

{% endblock %}
