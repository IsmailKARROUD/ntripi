<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" dir="{{ dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ display_name }} — Ntripi</title>
  <meta name="description" content="A private profile on Ntripi.">

  <!-- Open Graph — name and avatar only; a private account leaks nothing else -->
  <meta property="og:type"        content="profile">
  <meta property="og:site_name"   content="Ntripi">
  <meta property="og:title"       content="{{ display_name }}">
  <meta property="og:description" content="🔒 @{{ user.username }} on Ntripi. Open in the app to send a follow request.">
  <meta property="og:url"         content="{{ share_url }}">
  <meta property="og:image"       content="{{ preview_image_url }}">

  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="{{ display_name }}">
  <meta name="twitter:description" content="🔒 @{{ user.username }} on Ntripi. Open in the app to send a follow request.">
  <meta name="twitter:image"       content="{{ preview_image_url }}">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:  #4F46E5;
      --text:   #111827;
      --sub:    #6B7280;
      --border: #E5E7EB;
      --bg:     #F9FAFB;
      --white:  #FFFFFF;
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .avatar-fallback {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      color: var(--white);
      font-size: 38px;
      font-weight: 800;
    }

    .lock-icon { font-size: 32px; margin-bottom: 12px; }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .handle {
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .message {
      color: var(--sub);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .open-app-btn {
      display: inline-block;
      background: var(--brand);
      color: var(--white);
      font-weight: 700;
      font-size: 16px;
      padding: 13px 28px;
      border-radius: var(--radius);
      text-decoration: none;
      transition: opacity .15s;
      margin-bottom: 20px;
    }
    .open-app-btn:hover { opacity: .88; text-decoration: none; }

    .install-prompt {
      color: var(--sub);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .store-badges { display: flex; gap: 10px; justify-content: center; }
    .store-badge {
      background: var(--text);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
    }
    .store-badge:hover { opacity: .85; text-decoration: none; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: var(--sub);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Ntripi</div>
</header>

<main>
  <div class="card">
    {% if avatar_url %}
      <img class="avatar" src="{{ avatar_url }}" alt="">
    {% else %}
      <div class="avatar-fallback">{{ display_name[:1] | upper }}</div>
    {% endif %}

    <div class="lock-icon">🔒</div>
    <h1>{{ display_name }}</h1>
    <p class="handle">@{{ user.username }}</p>
    <p class="message">{{ _('share_profile_private_message') }}</p>

    <a href="ntripi://user/{{ user.username }}" class="open-app-btn">
      {{ _('share_open_in_app') }}
    </a>

    <p class="install-prompt">{{ _('share_install_prompt') }}</p>
    <div class="store-badges">
      <a href="#" class="store-badge">App Store</a>
      <a href="#" class="store-badge">Google Play</a>
    </div>
  </div>
</main>

<footer>
  <p>{{ _('share_shared_via') }} · <a href="/">ntripi.app</a></p>
</footer>

</body>
</html>
