{% extends "_base.html" %}
{% block content %}

<section class="card" style="max-width:400px;margin:0 auto">
  <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:20px;text-align:center">Set a new password</h2>

  {% if error_message %}
  <div class="error-banner">{{ error_message }}</div>
  {% endif %}

  <form method="POST" action="/web/reset-password">
    <input type="hidden" name="token" value="{{ token or '' }}">

    <div class="form-group">
      <label class="form-label" for="password">New password</label>
      <input class="form-input" type="password" id="password" name="password"
             required autofocus autocomplete="new-password"
             placeholder="At least 8 characters, one number">
    </div>

    <div class="form-group">
      <label class="form-label" for="password_confirm">Confirm new password</label>
      <input class="form-input" type="password" id="password_confirm" name="password_confirm"
             required autocomplete="new-password">
    </div>

    <button type="submit" class="btn-primary" style="width:100%;text-align:center;margin-top:8px">
      Update password
    </button>
  </form>
</section>

{% endblock %}
