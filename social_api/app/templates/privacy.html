{% extends "_base.html" %}
{% block content %}

<style>
  .legal-doc h1 {
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .last-updated {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 36px;
  }

  .prose h2 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 28px 0 10px;
    color: var(--text);
  }

  .prose p {
    font-size: 15px;
    color: var(--sub);
    margin-bottom: 12px;
    line-height: 1.7;
  }

  .prose a { color: var(--brand); }

  .prose code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
</style>

<section class="legal-doc" dir="ltr">
  <h1>Privacy Policy</h1>
  <p class="last-updated">Last updated: {{ last_updated }}</p>
  {% if _('legal_en_only_notice') %}
  <div class="error-banner" dir="auto">{{ _('legal_en_only_notice') }}</div>
  {% endif %}
  <div class="prose">
    {{ content | safe }}
  </div>
</section>

{% endblock %}
