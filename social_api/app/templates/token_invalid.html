{% extends "_base.html" %}
{% block content %}

<section class="card" style="max-width:400px;margin:0 auto;text-align:center">
  <div style="font-size:40px;margin-bottom:8px">⚠️</div>
  <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:10px">Link no longer valid</h2>
  <p style="color:var(--text2);font-size:14px;margin-bottom:20px">
    {{ message or "This link is invalid or has expired." }}
    Request a new one from the app and try again.
  </p>
  <a href="/app/" class="btn-secondary">Open Ntripi</a>
</section>

{% endblock %}
