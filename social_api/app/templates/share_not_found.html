<!DOCTYPE html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _('share_not_found_title') }}</title>
  <meta name="description" content="{{ _('share_not_found_body') }}">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:  #4F46E5;
      --text:   #111827;
      --sub:    #6B7280;
      --border: #E5E7EB;
      --bg:     #F9FAFB;
      --white:  #FFFFFF;
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .icon { font-size: 48px; margin-bottom: 16px; }

    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    p {
      color: var(--sub);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .home-link {
      display: inline-block;
      background: var(--brand);
      color: var(--white);
      font-weight: 700;
      font-size: 15px;
      padding: 11px 24px;
      border-radius: var(--radius);
      text-decoration: none;
    }
    .home-link:hover { opacity: .88; text-decoration: none; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: var(--sub);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Ntripi</div>
</header>

<main>
  <div class="card">
    <div class="icon">🗺️</div>
    <h1>{{ _('share_not_found_heading') }}</h1>
    <p>{{ _('share_not_found_body') }}</p>
    <a href="/" class="home-link">{{ _('share_go_to_ntripi') }}</a>
  </div>
</main>

<footer>
  <p>Ntripi · <a href="/">ntripi.app</a></p>
</footer>

</body>
</html>
